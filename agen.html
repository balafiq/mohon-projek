<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#3aa65b">
<title>Portal Agen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="ui.js"></script>
<style>
  main { max-width: 760px; }
  .bar-atas { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .bar-atas h2 { flex: 1; margin: 0; font-size: 1.15rem; display: flex; align-items: center; gap: 8px; }
  .ikon { width: 44px; min-height: 44px; padding: 0; flex: none; font-size: 1.2rem; }
  .cip-tapis { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; margin: 12px 0 8px; scrollbar-width: none; }
  .cip-tapis button {
    width: auto; min-height: 40px; flex: none;
    padding: 6px 14px; font-size: .9rem;
    background: #fff; color: var(--ink); border: 2px solid var(--garis);
  }
  .cip-tapis button b { background: var(--bg); border-radius: 999px; padding: 0 8px; margin-left: 2px; }
  .cip-tapis button.aktif { background: var(--hijau); border-color: var(--hijau); color: #fff; }
  .cip-tapis button.aktif b { background: rgba(255,255,255,.25); }
  .permohonan { background: #fff; border-radius: var(--bulat); padding: 18px; margin-bottom: 12px; box-shadow: var(--bayang); border: 2px solid transparent; }
  .permohonan.sorot { border-color: var(--kuning); }
  .p-atas { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .permohonan h3 { margin: 0; font-size: 1.1rem; font-weight: 800; }
  .ref { font-size: .8rem; color: var(--kelabu); }
  .butir { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 10px 0 14px; font-size: .95rem; }
  .lencana { font-size: .8rem; font-weight: 800; border-radius: 999px; padding: 4px 12px; white-space: nowrap; }
  .s-Baru { background: #e3efff; color: #1d4f9c; }
  .s-Sedang { background: var(--kuning-muda); color: #7a5a00; }
  .s-Lulus { background: var(--hijau-muda); color: var(--hijau-gelap); }
  .s-Tidak { background: var(--pic-muda); color: #a8342a; }
  .tindakan { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
  .tindakan select { min-height: 52px; border-radius: 999px; font-weight: 700; }
  .dokumen { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .dokumen:not(:empty) { margin-top: 14px; }
  .dok { background: var(--bg); border-radius: 16px; padding: 8px; font-size: .85rem; display: flex; flex-direction: column; gap: 6px; }
  .dok .label { font-weight: 800; padding: 0 4px; }
  .dok img, .dok .pdf { width: 100%; height: 110px; object-fit: cover; border-radius: 12px; background: #fff; }
  .dok .pdf { display: grid; place-items: center; font-weight: 800; color: var(--pic); }
  .dok .pautan { display: flex; justify-content: space-between; padding: 0 4px; }
  .dok a { color: var(--hijau-gelap); font-weight: 800; text-decoration: none; }
  .kosong { text-align: center; color: var(--kelabu); padding: 30px 0; }
  @media (max-width: 480px) {
    .bar-atas { gap: 8px; margin-bottom: 10px; }
    .bar-atas h2 { font-size: 1rem; gap: 6px; }
    .ikon { width: 40px; min-height: 40px; }
    #logKeluar { min-height: 40px !important; padding: 6px 12px !important; font-size: .9rem; }
    .cip-tapis { margin: 10px 0 0; gap: 6px; }
    .cip-tapis button { min-height: 34px; padding: 4px 10px; font-size: .82rem; }
    .permohonan { padding: 14px; border-radius: 18px; margin-bottom: 10px; }
    .permohonan h3 { font-size: 1rem; }
    .butir { margin: 8px 0 10px; font-size: .9rem; }
    .tindakan { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
    .tindakan select { min-height: 44px; }
    .tindakan button { min-height: 44px; font-size: .9rem; }
    .dokumen { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .dok { padding: 6px; border-radius: 12px; font-size: .8rem; }
    .dok img, .dok .pdf { height: 84px; border-radius: 8px; }
  }
</style>
</head>
<body>
<header class="kepala">
  <i data-emoji="1f33d" data-alt="🌽"></i>
  <h1>Portal Agen</h1>
</header>

<main>
  <!-- LOG MASUK -->
  <section id="skrinLogin" class="kad">
    <div class="tengah">
      <i data-emoji="1f44b" data-alt="👋" class="besar"></i>
      <h2>Selamat datang!</h2>
      <p class="sub">Log masuk untuk lihat permohonan</p>
    </div>
    <form id="borangLogin" novalidate>
      <div class="soalan">
        <label for="mukimLogin">Mukim</label>
        <select id="mukimLogin"><option value="">Pilih mukim</option></select>
      </div>
      <div class="soalan">
        <label for="kataLaluan">Kata laluan</label>
        <input type="password" id="kataLaluan" autocomplete="current-password">
      </div>
      <p id="ralatLogin" class="notis gagal tersembunyi" role="alert"></p>
      <button type="submit" class="btn-utama" id="butangLogin">🔒 Log masuk</button>
    </form>
  </section>

  <!-- SENARAI -->
  <section id="skrinSenarai" class="tersembunyi">
    <div class="kad" style="padding:16px">
      <div class="bar-atas">
        <h2><i data-emoji="1f33f" data-alt="🌿" class="kecil"></i><span id="tajukMukim"></span></h2>
        <button type="button" class="btn-kedua ikon" id="muatSemula" title="Muat semula" aria-label="Muat semula">↻</button>
        <button type="button" class="btn-kedua" id="logKeluar" style="width:auto;min-height:44px;padding:8px 16px">Keluar</button>
      </div>
      <input type="search" id="cari" placeholder="🔍 Cari nama, lokasi, tanaman, rujukan">
      <div class="cip-tapis" id="tapisStatus"></div>
    </div>
    <p id="ralatSenarai" class="notis gagal tersembunyi" role="alert"></p>
    <div id="senarai"></div>
  </section>
</main>

<script>
{
  const $ = (id) => document.getElementById(id);
  const parameterRef = new URLSearchParams(location.search).get("ref");
  let sesi = null;
  let permohonan = [];
  let senaraiStatus = [];
  let statusDipilih = "";
  const urlBlob = [];

  MUKIM.forEach((m, i) => $("mukimLogin").insertAdjacentHTML("beforeend", `<option value="${i}">${m.nama}</option>`));

  function simpanSesi(s) {
    sesi = s;
    try { s ? sessionStorage.setItem("sesiAgen", JSON.stringify(s)) : sessionStorage.removeItem("sesiAgen"); } catch {}
  }

  function tunjuk(skrin) {
    $("skrinLogin").classList.toggle("tersembunyi", skrin !== "login");
    $("skrinSenarai").classList.toggle("tersembunyi", skrin !== "senarai");
  }

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  async function api(tindakan, data = {}) {
    try {
      return await panggilApi(tindakan, { token: sesi?.token, ...data });
    } catch (err) {
      if (/Sesi tamat/.test(err.message)) {
        simpanSesi(null);
        tunjuk("login");
        $("ralatLogin").textContent = err.message;
        $("ralatLogin").classList.remove("tersembunyi");
      }
      throw err;
    }
  }

  // ---------- Log masuk ----------
  $("borangLogin").addEventListener("submit", async (e) => {
    e.preventDefault();
    const ralat = $("ralatLogin");
    ralat.classList.add("tersembunyi");
    const mukim = $("mukimLogin").value;
    const kataLaluan = $("kataLaluan").value;
    const salah = (m) => { ralat.textContent = m; ralat.classList.remove("tersembunyi"); };
    if (!mukim || !kataLaluan) return salah("Sila pilih mukim dan isi kata laluan.");
    if (!API_URL) return salah("Sistem belum disediakan.");

    const b = $("butangLogin");
    b.disabled = true;
    b.innerHTML = '<span class="muat"></span>Log masuk...';
    try {
      const r = await panggilApi("login", { mukim: Number(mukim), kataLaluan });
      simpanSesi({ token: r.token, mukim: r.mukim, namaMukim: r.namaMukim });
      $("kataLaluan").value = "";
      await bukaSenarai();
    } catch (err) {
      salah(err.message);
    } finally {
      b.disabled = false;
      b.textContent = "🔒 Log masuk";
    }
  });

  $("logKeluar").addEventListener("click", async () => {
    try { await panggilApi("logout", { token: sesi?.token }); } catch {}
    simpanSesi(null);
    urlBlob.splice(0).forEach((u) => URL.revokeObjectURL(u));
    $("senarai").innerHTML = "";
    tunjuk("login");
  });

  // ---------- Senarai ----------
  async function bukaSenarai() {
    tunjuk("senarai");
    $("tajukMukim").textContent = sesi.namaMukim;
    await muatSenarai();
  }

  async function muatSenarai() {
    $("ralatSenarai").classList.add("tersembunyi");
    $("senarai").innerHTML = `<p class="kosong">${emoji("23f3", "⏳", "kecil")} Memuatkan...</p>`;
    try {
      const r = await api("senarai");
      permohonan = r.permohonan;
      senaraiStatus = r.senaraiStatus;
      lukis();
      if (parameterRef) {
        const kad = document.querySelector(`[data-ref="${CSS.escape(parameterRef)}"]`);
        if (kad) {
          kad.classList.add("sorot");
          kad.scrollIntoView({ behavior: "smooth", block: "start" });
          bukaDokumen(parameterRef);
        }
      }
    } catch (err) {
      $("senarai").innerHTML = "";
      $("ralatSenarai").textContent = err.message;
      $("ralatSenarai").classList.remove("tersembunyi");
    }
  }

  const kelasStatus = (s) => "s-" + String(s).split(" ")[0];

  function lukisTapis() {
    const kiraan = {};
    permohonan.forEach((p) => (kiraan[p.status] = (kiraan[p.status] || 0) + 1));
    $("tapisStatus").innerHTML = [["", "Semua", permohonan.length], ...senaraiStatus.map((s) => [s, s, kiraan[s] || 0])]
      .map(([v, l, n]) => `<button type="button" data-tapis="${esc(v)}" class="${v === statusDipilih ? "aktif" : ""}">${esc(l)} <b>${n}</b></button>`)
      .join("");
  }

  function lukis() {
    lukisTapis();
    const q = $("cari").value.trim().toLowerCase();
    const tapis = permohonan.filter((p) =>
      (!statusDipilih || p.status === statusDipilih) &&
      (!q || [p.nama, p.lokasi, p.tanaman, p.rujukan].join(" ").toLowerCase().includes(q)));

    if (!tapis.length) {
      $("senarai").innerHTML = `<div class="kosong">${emoji("1f331", "🌱", "besar")}${permohonan.length ? "Tiada padanan" : "Belum ada permohonan"}</div>`;
      return;
    }
    $("senarai").innerHTML = tapis.map((p) => `
      <article class="permohonan" data-ref="${esc(p.rujukan)}">
        <div class="p-atas">
          <div>
            <h3>${esc(p.nama)}</h3>
            <span class="ref">${esc(p.rujukan)} · ${new Date(p.tarikh).toLocaleDateString("ms-MY", { day: "numeric", month: "short", year: "numeric" })}</span>
          </div>
          <span class="lencana ${kelasStatus(p.status)}">${esc(p.status)}</span>
        </div>
        <div class="butir">
          <span>📍 ${esc(p.lokasi)}</span>
          <span>🌿 ${esc(p.tanaman)}</span>
        </div>
        <div class="tindakan">
          <button type="button" class="btn-utama" data-dokumen="${esc(p.rujukan)}">Dokumen (${p.fail.length})</button>
          <select data-status="${esc(p.rujukan)}" aria-label="Status">
            ${senaraiStatus.map((s) => `<option ${s === p.status ? "selected" : ""}>${esc(s)}</option>`).join("")}
          </select>
        </div>
        <div class="dokumen" id="dok-${esc(p.rujukan)}"></div>
      </article>`).join("");
  }

  $("cari").addEventListener("input", lukis);
  $("muatSemula").addEventListener("click", muatSenarai);
  $("tapisStatus").addEventListener("click", (e) => {
    const b = e.target.closest("[data-tapis]");
    if (!b) return;
    statusDipilih = b.dataset.tapis;
    lukis();
  });

  $("senarai").addEventListener("click", (e) => {
    const ref = e.target.closest("[data-dokumen]")?.dataset.dokumen;
    if (ref) bukaDokumen(ref);
  });

  $("senarai").addEventListener("change", async (e) => {
    const ref = e.target.dataset.status;
    if (!ref) return;
    const p = permohonan.find((x) => x.rujukan === ref);
    const lama = p.status;
    e.target.disabled = true;
    try {
      await api("status", { rujukan: ref, status: e.target.value });
      p.status = e.target.value;
      const lencana = e.target.closest(".permohonan").querySelector(".lencana");
      lencana.className = "lencana " + kelasStatus(p.status);
      lencana.textContent = p.status;
      lukisTapis();
    } catch (err) {
      e.target.value = lama;
      $("ralatSenarai").textContent = "Gagal tukar status: " + err.message;
      $("ralatSenarai").classList.remove("tersembunyi");
    } finally {
      e.target.disabled = false;
    }
  });

  // ---------- Dokumen ----------
  async function bukaDokumen(ref) {
    const p = permohonan.find((x) => x.rujukan === ref);
    const kotak = $("dok-" + ref);
    if (!p || !kotak || kotak.dataset.dimuat) return;
    kotak.dataset.dimuat = "1";
    const butang = document.querySelector(`[data-dokumen="${CSS.escape(ref)}"]`);
    if (butang) { butang.disabled = true; butang.textContent = "✓ Dibuka"; }

    kotak.innerHTML = p.fail.map((f) => `
      <div class="dok" id="f-${esc(f.id)}">
        <span class="label">${esc(f.jenis)}</span>
        <div class="pdf"><span class="muat" style="color:var(--hijau)"></span></div>
      </div>`).join("");

    for (const f of p.fail) {
      const el = document.getElementById("f-" + f.id);
      try {
        const r = await api("fail", { rujukan: ref, idFail: f.id });
        const bait = Uint8Array.from(atob(r.data), (c) => c.charCodeAt(0));
        const url = URL.createObjectURL(new Blob([bait], { type: r.mimeType }));
        urlBlob.push(url);
        const pratonton = r.mimeType.startsWith("image/")
          ? `<a href="${url}" target="_blank" rel="noopener"><img src="${url}" alt="${esc(f.jenis)}"></a>`
          : `<a href="${url}" target="_blank" rel="noopener" class="pdf">PDF</a>`;
        el.innerHTML = `
          <span class="label">${esc(f.jenis)}</span>
          ${pratonton}
          <div class="pautan"><a href="${url}" target="_blank" rel="noopener">Buka</a><a href="${url}" download="${esc(r.nama)}">Simpan ⬇</a></div>`;
      } catch (err) {
        el.innerHTML = `<span class="label">${esc(f.jenis)}</span><span class="ralat tunjuk">${esc(err.message)}</span>`;
      }
    }
  }

  // ---------- Mula ----------
  try { sesi = JSON.parse(sessionStorage.getItem("sesiAgen") || "null"); } catch {}
  if (sesi && API_URL) bukaSenarai();
  else tunjuk("login");
}
</script>
</body>
</html>
